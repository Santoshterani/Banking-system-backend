spring.application.name=banking_system
server.port=9090

# ---------------- Datasource ----------------
# NOTE: the original file had "// your username" style comments appended directly onto
# property values (e.g. spring.datasource.username=root //your username). Properties files
# do NOT support // comments - that entire trailing string becomes part of the value, which
# silently broke the DB connection. Fixed below, and moved to env vars with sane local
# defaults so secrets aren't committed to source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------------- Mail ----------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------- JWT ----------------
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-production-at-least-256-bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---------------- Swagger / OpenAPI ----------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------------- Approval workflow ----------------
# Deposits/withdrawals/transfers above this amount, made by a branch-level role (cashier,
# customer service executive), are parked as PENDING and require branch-manager sign-off.
banking.approval.large-transaction-threshold=${LARGE_TXN_THRESHOLD:50000}

# ---------------- Bootstrap admin ----------------
# DataInitializer seeds this account on first run IF no users exist yet, so there's always
# a way to log in and start creating branches/employees. Change the password immediately
# after first login in any real deployment - this is a local-dev convenience only.
banking.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@bank.com}
banking.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}

# ---------------- Jackson ----------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------- Actuator / Prometheus ----------------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

# ---------------- Password reset OTP ----------------
banking.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

# ---------------- Login protection ----------------
banking.security.max-failed-login-attempts=${MAX_FAILED_LOGIN_ATTEMPTS:5}
banking.security.account-lock-minutes=${ACCOUNT_LOCK_MINUTES:15}

# ---------------- Pagination defaults ----------------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
